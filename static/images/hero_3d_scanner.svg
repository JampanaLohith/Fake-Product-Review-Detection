<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Background & Mesh Gradients -->
    <radialGradient id="stageGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#060b18" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <linearGradient id="greenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="redGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Filters for 3D Glow and Soft Shadows -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <style>
    @keyframes floatA {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-16px) rotate(1deg); }
    }
    @keyframes floatB {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(14px) rotate(-1deg); }
    }
    @keyframes pulseRing {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.04); }
    }
    @keyframes beamScan {
      0% { opacity: 0.2; transform: translateY(-30px); }
      50% { opacity: 0.8; transform: translateY(30px); }
      100% { opacity: 0.2; transform: translateY(-30px); }
    }
    .floating-left { animation: floatA 6s ease-in-out infinite; transform-origin: center; }
    .floating-right { animation: floatB 7s ease-in-out infinite; transform-origin: center; }
    .pulse-ring { animation: pulseRing 4s ease-in-out infinite; transform-origin: 450px 380px; }
  </style>

  <!-- Ambient Glow Background -->
  <ellipse cx="450" cy="340" rx="380" ry="240" fill="url(#stageGlow)"/>

  <!-- 3D Isometric Platform (Pedestal) -->
  <g transform="translate(450, 430)">
    <!-- Base Disc Back Shadow -->
    <ellipse cx="0" cy="50" rx="320" ry="110" fill="#030712" opacity="0.8"/>
    <ellipse cx="0" cy="40" rx="290" ry="95" fill="#091124" opacity="0.9"/>
    
    <!-- Outer Cyber Ring -->
    <ellipse cx="0" cy="25" rx="270" ry="85" fill="none" stroke="#1e3a8a" stroke-width="2.5" stroke-dasharray="8 6"/>
    <ellipse cx="0" cy="20" rx="250" ry="78" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.7" class="pulse-ring"/>

    <!-- Middle Pedestal Plate -->
    <ellipse cx="0" cy="10" rx="210" ry="65" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <ellipse cx="0" cy="5" rx="190" ry="58" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Grid lines on platform -->
    <path d="M -160 5 L 160 5" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
    <path d="M -120 -25 L 120 35" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3"/>
    <path d="M -120 35 L 120 -25" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Central Glowing Core Pillar -->
    <ellipse cx="0" cy="-10" rx="100" ry="32" fill="#1e1b4b" stroke="#60a5fa" stroke-width="2" filter="url(#glowBlue)"/>
  </g>

  <!-- 3D Holographic Beams -->
  <g opacity="0.65">
    <polygon points="450,150 310,410 590,410" fill="url(#stageGlow)"/>
    <line x1="450" y1="120" x2="450" y2="420" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 5" opacity="0.6"/>
  </g>

  <!-- 3D Center Shield -->
  <g transform="translate(450, 260)" filter="url(#shadow3D)">
    <!-- Back Glow -->
    <circle cx="0" cy="-10" r="95" fill="#3b82f6" opacity="0.25" filter="url(#glowCyan)"/>

    <!-- Outer Shield Extrusion (3D Depth) -->
    <path d="M 0 -85 L 75 -40 L 75 40 Q 0 115 -75 40 L -75 -40 Z" fill="#1e3a8a" opacity="0.9"/>
    
    <!-- Main Front Shield Face -->
    <path d="M 0 -95 L 70 -50 L 70 30 Q 0 105 -70 30 L -70 -50 Z" fill="url(#shieldGrad)" stroke="#93c5fd" stroke-width="3"/>

    <!-- Inner Glass Inset -->
    <path d="M 0 -80 L 54 -42 L 54 22 Q 0 85 -54 22 L -54 -42 Z" fill="#0f172a" opacity="0.85" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

    <!-- Glowing Checkmark / AI Lock -->
    <path d="M -22 -2 L -6 16 L 24 -18" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowBlue)"/>
    
    <!-- AI Chip Badge underneath Checkmark -->
    <rect x="-30" y="38" width="60" height="20" rx="10" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="0" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1.5">AI SAFE</text>
  </g>

  <!-- LEFT FLOATING CARD: Genuine Review (Isometric Perspective) -->
  <g class="floating-left" transform="translate(80, 160)" filter="url(#shadow3D)">
    <!-- 3D Tilted Card Body -->
    <polygon points="40,20 280,0 260,210 20,230" fill="url(#cardGlass)" stroke="rgba(34, 197, 94, 0.5)" stroke-width="2"/>
    <polygon points="40,20 280,0 282,10 42,30" fill="rgba(255,255,255,0.2)"/>
    
    <!-- Verified Badge Pill -->
    <g transform="translate(55, 35)">
      <rect x="0" y="0" width="130" height="26" rx="13" fill="url(#greenGlass)" stroke="#22c55e" stroke-width="1.5"/>
      <circle cx="14" cy="13" r="6" fill="#22c55e"/>
      <path d="M 11 13 L 13 15 L 17 11" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <text x="26" y="17" fill="#86efac" font-family="system-ui, sans-serif" font-size="11" font-weight="700">VERIFIED GENUINE</text>
    </g>

    <!-- Star Ratings -->
    <g transform="translate(55, 75)" fill="url(#goldGrad)">
      <polygon points="10,1 12,7 18,7 13,11 15,17 10,13 5,17 7,11 2,7 8,7"/>
      <polygon points="30,1 32,7 38,7 33,11 35,17 30,13 25,17 27,11 22,7 28,7"/>
      <polygon points="50,1 52,7 58,7 53,11 55,17 50,13 45,17 47,11 42,7 48,7"/>
      <polygon points="70,1 72,7 78,7 73,11 75,17 70,13 65,17 67,11 62,7 68,7"/>
      <polygon points="90,1 92,7 98,7 93,11 95,17 90,13 85,17 87,11 82,7 88,7"/>
      <text x="110" y="14" fill="#fef08a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">5.0</text>
    </g>

    <!-- Review Text Lines -->
    <rect x="55" y="105" width="180" height="8" rx="4" fill="rgba(255,255,255,0.7)"/>
    <rect x="55" y="122" width="150" height="8" rx="4" fill="rgba(255,255,255,0.5)"/>
    <rect x="55" y="139" width="165" height="8" rx="4" fill="rgba(255,255,255,0.5)"/>
    <rect x="55" y="156" width="100" height="8" rx="4" fill="rgba(255,255,255,0.3)"/>

    <!-- Confidence Metric -->
    <g transform="translate(55, 182)">
      <text x="0" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Confidence Score</text>
      <text x="140" y="16" fill="#4ade80" font-family="system-ui, sans-serif" font-size="13" font-weight="800">99.4%</text>
    </g>
  </g>

  <!-- RIGHT FLOATING CARD: Fake Review Detected (Isometric Perspective) -->
  <g class="floating-right" transform="translate(540, 130)" filter="url(#shadow3D)">
    <!-- 3D Tilted Card Body -->
    <polygon points="20,0 260,20 280,230 40,210" fill="url(#cardGlass)" stroke="rgba(239, 68, 68, 0.55)" stroke-width="2"/>
    <polygon points="20,0 260,20 258,30 18,10" fill="rgba(255,255,255,0.15)"/>
    
    <!-- Flagged Warning Pill -->
    <g transform="translate(45, 32)">
      <rect x="0" y="0" width="135" height="26" rx="13" fill="url(#redGlass)" stroke="#ef4444" stroke-width="1.5"/>
      <circle cx="14" cy="13" r="6" fill="#ef4444"/>
      <text x="14" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">!</text>
      <text x="26" y="17" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">BOT SPAM DETECTED</text>
    </g>

    <!-- Synthetic Score Warning -->
    <g transform="translate(45, 75)">
      <rect x="0" y="0" width="190" height="24" rx="6" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.3)" stroke-width="1"/>
      <text x="10" y="16" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" font-weight="700">100% INCENTIVIZED PATTERN</text>
    </g>

    <!-- Sarcastic/Fake Review Text -->
    <rect x="45" y="112" width="180" height="8" rx="4" fill="rgba(248,113,113,0.7)"/>
    <rect x="45" y="129" width="160" height="8" rx="4" fill="rgba(248,113,113,0.5)"/>
    <rect x="45" y="146" width="170" height="8" rx="4" fill="rgba(248,113,113,0.5)"/>
    
    <!-- Red Stamp: FAKE -->
    <g transform="translate(130, 160) rotate(-12)">
      <rect x="0" y="0" width="90" height="32" rx="6" fill="none" stroke="#ef4444" stroke-width="3"/>
      <text x="45" y="22" fill="#ef4444" font-family="system-ui, sans-serif" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="3">FAKE</text>
    </g>
  </g>

  <!-- Floating 3D Stars & Badges -->
  <g transform="translate(450, 90)" filter="url(#glowCyan)" class="floating-left">
    <circle cx="-160" cy="0" r="16" fill="#3b82f6" opacity="0.8"/>
    <text x="-160" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">NLP</text>
  </g>

  <g transform="translate(450, 80)" filter="url(#glowCyan)" class="floating-right">
    <circle cx="160" cy="15" r="18" fill="#8b5cf6" opacity="0.85"/>
    <text x="160" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">ML</text>
  </g>

  <g transform="translate(260, 420)" class="floating-right">
    <rect x="0" y="0" width="110" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <text x="55" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Amazon / Flipkart</text>
  </g>

  <g transform="translate(560, 420)" class="floating-left">
    <rect x="0" y="0" width="105" height="32" rx="16" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" opacity="0.9"/>
    <text x="52" y="20" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TF-IDF Vector</text>
  </g>
</svg>
